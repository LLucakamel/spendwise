<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SpendWise — track income and expenses, budgets and recurring bills." />
    <meta name="theme-color" content="#1f6f4f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>SpendWise</title>
    <script>
      // Apply the saved theme, language and text direction before first paint to avoid a flash.
      ;(function () {
        try {
          var lang = localStorage.getItem('spendwise.lang')
          if (lang !== 'ar' && lang !== 'en') lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
          var pref = localStorage.getItem('spendwise.theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SpendWise needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
